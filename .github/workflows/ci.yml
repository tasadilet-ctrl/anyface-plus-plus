name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch: nothing here needs a GPU, and the CUDA wheel is
      # several GB. The tests build small networks and stub the detector, so
      # no model weights are downloaded either.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Recompute the age-code comparison
        # Reproduces the numbers quoted in the README's "Age coding" section.
        # Pure arithmetic over the codes -- no data, no weights, deterministic.
        run: python3 benchmarks/age_encoding.py

      - name: Recompute the mood-metric comparison
        # Reproduces the numbers in the README's "Class imbalance" section
        # from FER2013's published class counts. No images needed.
        run: python3 benchmarks/mood_metrics.py

      - name: Verify the MTL head builds and runs
        # Replaces setup_mtl.sh, whose own verification block had never run.
        run: python3 yolo26_mtl/scripts/verify_mtl.py

      - name: Check entry points are importable
        run: |
          python -c "from anyface_pp.models.face_detector import FaceDetector; print('ok')"
          python -c "from anyface_pp.pipeline import AnyfacePP; print('ok')"
          python scripts/download_face_model.py --help
          python train_age.py --help > /dev/null
          python train_mood.py --help > /dev/null
          python yolo26_mtl/scripts/train_mtl.py --help > /dev/null
          python yolo26_mtl/scripts/infer_mtl.py --help > /dev/null
